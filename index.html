<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CleanMas Admin</title>
  <style>
    :root{--g:#0c6b35;--l:#79c51d;--bg:#f4f8f3;--line:#dce7db;--m:#66766b;--red:#962c21}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#193523}.w{max-width:1250px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h1{margin:0;color:var(--g)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 30px #0001}.login{max-width:480px;margin:50px auto}.f{margin:10px 0}.f label{display:block;font-size:12px;font-weight:900;margin-bottom:5px}.f input,.f textarea,.f select{width:100%;padding:11px;border:1px solid #cbd8cb;border-radius:9px;background:#fff;font-size:15px}.f textarea{min-height:80px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.pri{background:var(--g);color:#fff}.sec{background:#e8f3e4;color:var(--g)}.danger{background:#ffe5e0;color:var(--red)}.acts,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{margin:20px 0}.tab{font-size:15px}.tab.on{background:var(--g);color:#fff}.msg{padding:10px;border-radius:9px;margin:10px 0}.ok{background:#e7f7df}.err{background:#ffe5e0;color:#8b261d}.grid{display:grid;grid-template-columns:380px 1fr;gap:16px}.search{display:flex;gap:8px;margin-bottom:10px}.search input{flex:1;padding:10px;border:1px solid #cbd8cb;border-radius:9px}.tw{overflow:auto}.t{width:100%;border-collapse:collapse}.t th,.t td{padding:8px 7px;border-bottom:1px solid #e8ede7;font-size:13px;text-align:left;vertical-align:middle}.t th{background:#edf5e9}.mi{width:64px;height:50px;border-radius:8px;object-fit:cover;background:#eef5eb}.st{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px}.vis{background:#e6f5de;color:var(--g)}.hid{background:#f3eded;color:#79524e}.checks{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:800}.hint{font-size:12px;color:var(--m);line-height:1.4}.panel{display:none}.panel.on{display:block}.preview{width:100%;height:150px;object-fit:cover;border-radius:12px;background:#eef5eb;display:none;margin-top:8px}
    @media(max-width:900px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.t th:nth-child(3),.t td:nth-child(3){display:none}.w{padding:12px}}
  </style>
</head>
<body>
<div class="w">
  <div class="head"><div><h1>CleanMas · Administración</h1><div style="color:#66766b">Productos, precios, fotos, ofertas y banners</div></div><div><a class="btn sec" style="text-decoration:none" href="https://catalogo.cleanmasapp.com.ar" target="_blank">Ver catálogo</a> <button id="logout" class="btn sec" style="display:none">Salir</button></div></div>
  <div id="login" class="card login"><h2>Acceso privado</h2><p id="loginText">Cargando…</p><div id="authmsg"></div><div id="setupCodeBox" class="f" style="display:none"><label>Código de activación</label><input id="code" autocomplete="off"></div><div class="f"><label>Contraseña</label><input id="pass" type="password" minlength="8"></div><div class="acts"><button id="go" class="btn pri">Continuar</button></div></div>
  <div id="area" style="display:none">
    <div class="tabs"><button class="btn tab on" data-panel="productsPanel">Productos</button><button class="btn tab sec" data-panel="bannersPanel">Banners</button></div>
    <div id="msg"></div>
    <div id="productsPanel" class="panel on"><div class="grid">
      <section class="card"><h2 id="ft">Agregar producto</h2><input id="pid" type="hidden"><div class="f"><label>Nombre</label><input id="pn"></div><div class="f"><label>Precio</label><input id="pp" type="number" min="0"></div><div class="f"><label>Categoría</label><input id="pc"></div><div class="f"><label>Descripción</label><textarea id="pd"></textarea></div><div class="f"><label>Foto JPG/PNG/WEBP (máx. 5 MB)</label><input id="pi" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="checks"><label><input id="po" type="checkbox"> Oferta</label><label><input id="pf" type="checkbox"> Destacado</label><label><input id="pa" type="checkbox" checked> Visible</label></div><div class="acts"><button id="save" class="btn pri">Guardar</button><button id="reset" class="btn sec">Limpiar</button></div></section>
      <section class="card"><div class="search"><input id="s" placeholder="Buscar producto..."><button id="ref" class="btn sec">Actualizar</button></div><div class="tw"><table class="t"><thead><tr><th>Foto</th><th>Producto</th><th>Categoría</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div></section>
    </div></div>
    <div id="bannersPanel" class="panel"><div class="grid">
      <section class="card"><h2 id="bt">Agregar banner</h2><input id="bid" type="hidden"><div class="f"><label>Texto superior</label><input id="be" placeholder="Ej.: OFERTA DE LA SEMANA"></div><div class="f"><label>Título principal</label><input id="btitle"></div><div class="f"><label>Descripción</label><textarea id="bd"></textarea></div><div class="f"><label>Texto del botón</label><input id="bbt" placeholder="Ej.: Ver productos"></div><div class="f"><label>Enlace del botón</label><input id="bbu" placeholder="#productos o https://..."></div><div class="f"><label>Color del banner</label><select id="btheme"><option value="club">Verde Club</option><option value="week">Rojo y amarillo</option><option value="cash">Rojo beneficio</option><option value="news">Verde nuevos productos</option></select></div><div class="f"><label>Ícono (si no usás imagen)</label><input id="bicon" placeholder="🎁"></div><div class="f"><label>Imagen JPG/PNG/WEBP (máx. 5 MB)</label><input id="bi" type="file" accept="image/jpeg,image/png,image/webp"><div class="hint">Si no elegís una imagen nueva, se mantiene la actual.</div><img id="bpreview" class="preview" alt="Vista previa"></div><div class="f"><label>Orden</label><input id="border" type="number" min="1" value="1"></div><div class="checks"><label><input id="bactive" type="checkbox" checked> Visible</label></div><div class="acts"><button id="bsave" class="btn pri">Guardar banner</button><button id="breset" class="btn sec">Limpiar</button></div></section>
      <section class="card"><div class="search"><strong style="flex:1;padding:10px 0">Banners del catálogo</strong><button id="bref" class="btn sec">Actualizar</button></div><div class="tw"><table class="t"><thead><tr><th>Imagen</th><th>Banner</th><th>Orden</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="brows"></tbody></table></div></section>
    </div></div>
  </div>
</div>
<script>
const API='https://tqemhguuqmxqlquwmbcq.supabase.co/functions/v1/cleanmas-admin';
let token=localStorage.getItem('cleanmas_admin_token')||'',P=[],B=[],configured=true;
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n)||0),show=(el,t,type='ok')=>el.innerHTML='<div class="msg '+type+'">'+esc(t)+'</div>';
async function api(action,payload={},auth=true){let h={'Content-Type':'application/json'};if(auth&&token)h.Authorization='Bearer '+token;let r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify({action,...payload})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j}
async function boot(){try{let st=await api('status',{},false);configured=st.configured;if(token){try{await load();openArea();return}catch{localStorage.removeItem('cleanmas_admin_token');token=''}}$('loginText').textContent=configured?'Ingresá con tu contraseña de administrador.':'Primera configuración: ingresá el código de activación y elegí tu contraseña.';$('setupCodeBox').style.display=configured?'none':'block'}catch(e){show($('authmsg'),e.message,'err')}}
$('go').onclick=async()=>{try{let a=configured?'login':'setup',j=await api(a,{password:$('pass').value,activation_code:$('code').value},false);token=j.token;localStorage.setItem('cleanmas_admin_token',token);await load();openArea()}catch(e){show($('authmsg'),e.message,'err')}};
function openArea(){$('login').style.display='none';$('area').style.display='block';$('logout').style.display='inline-block'}
$('logout').onclick=async()=>{try{await api('logout')}catch{}localStorage.removeItem('cleanmas_admin_token');location.reload()};
document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));btn.classList.add('on');$(btn.dataset.panel).classList.add('on');scrollTo({top:0,behavior:'smooth'})});
async function load(){let j=await api('list');P=j.products||[];B=j.banners||[];rr();br()}
function rr(){let q=$('s').value.toLowerCase(),a=P.filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q));$('rows').innerHTML=a.map(p=>'<tr><td>'+(p.image_url?'<img class="mi" src="'+esc(p.image_url)+'">':'<div class="mi"></div>')+'</td><td><strong>'+esc(p.name)+'</strong>'+(p.is_offer?'<div style="color:#e93a24;font-size:10px;font-weight:900">🔥 OFERTA</div>':'')+'</td><td>'+esc(p.category)+'</td><td><strong style="color:#0c6b35">'+money(p.price)+'</strong></td><td><span class="st '+(p.active?'vis':'hid')+'">'+(p.active?'Visible':'Oculto')+'</span></td><td><button class="btn sec" onclick="editP('+p.id+')">Editar</button> <button class="btn danger" onclick="delP('+p.id+')">Eliminar</button></td></tr>').join('')}
$('s').oninput=rr;$('ref').onclick=load;
function resetP(){['pid','pn','pp','pc','pd'].forEach(i=>$(i).value='');$('pi').value='';$('po').checked=false;$('pf').checked=false;$('pa').checked=true;$('ft').textContent='Agregar producto'}$('reset').onclick=resetP;
window.editP=id=>{let p=P.find(x=>+x.id===+id);$('pid').value=p.id;$('pn').value=p.name;$('pp').value=+p.price;$('pc').value=p.category;$('pd').value=p.description||'';$('po').checked=!!p.is_offer;$('pf').checked=!!p.is_featured;$('pa').checked=!!p.active;$('ft').textContent='Editar producto';scrollTo({top:0,behavior:'smooth'})};
function file64(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)})}
$('save').onclick=async()=>{let id=+$('pid').value||0,n=$('pn').value.trim(),price=+$('pp').value,c=$('pc').value.trim().toUpperCase();if(!n||!c||!Number.isFinite(price)||price<0){show($('msg'),'Completá nombre, precio y categoría.','err');return}try{let iu=id?(P.find(x=>+x.id===id)?.image_url||null):null,f=$('pi').files[0];if(f){let u=await api('upload',{filename:f.name,content_type:f.type,base64:await file64(f),folder:'products'});iu=u.public_url}await api('save',{product:{id:id||null,name:n,price,category:c,description:$('pd').value.trim(),image_url:iu,is_offer:$('po').checked,is_featured:$('pf').checked,active:$('pa').checked}});show($('msg'),'Producto guardado.');resetP();await load()}catch(e){show($('msg'),e.message,'err')}};
window.delP=async id=>{let p=P.find(x=>+x.id===+id);if(!confirm('¿Eliminar "'+p.name+'"?'))return;try{await api('delete',{id});show($('msg'),'Producto eliminado.');await load()}catch(e){show($('msg'),e.message,'err')}};
function br(){$('brows').innerHTML=B.map(b=>'<tr><td>'+(b.image_url?'<img class="mi" src="'+esc(b.image_url)+'">':'<div class="mi" style="display:grid;place-items:center;font-size:26px">'+esc(b.icon||'✨')+'</div>')+'</td><td><strong>'+esc(b.title)+'</strong><div class="hint">'+esc(b.eyebrow||'')+'</div></td><td>'+Number(b.sort_order||0)+'</td><td><span class="st '+(b.active?'vis':'hid')+'">'+(b.active?'Visible':'Oculto')+'</span></td><td><button class="btn sec" onclick="editB('+b.id+')">Editar</button> <button class="btn danger" onclick="delB('+b.id+')">Eliminar</button></td></tr>').join('')}
function resetB(){['bid','be','btitle','bd','bbt','bbu','bicon'].forEach(i=>$(i).value='');$('bi').value='';$('btheme').value='club';$('border').value=B.length+1;$('bactive').checked=true;$('bt').textContent='Agregar banner';$('bpreview').style.display='none';$('bpreview').removeAttribute('src')}$('breset').onclick=resetB;$('bref').onclick=load;
$('bi').onchange=()=>{let f=$('bi').files[0];if(f){$('bpreview').src=URL.createObjectURL(f);$('bpreview').style.display='block'}};
window.editB=id=>{let b=B.find(x=>+x.id===+id);$('bid').value=b.id;$('be').value=b.eyebrow||'';$('btitle').value=b.title||'';$('bd').value=b.description||'';$('bbt').value=b.button_text||'';$('bbu').value=b.button_url||'';$('btheme').value=b.theme||'club';$('bicon').value=b.icon||'';$('border').value=Number(b.sort_order||1);$('bactive').checked=!!b.active;$('bt').textContent='Editar banner';if(b.image_url){$('bpreview').src=b.image_url;$('bpreview').style.display='block'}else{$('bpreview').style.display='none'}scrollTo({top:0,behavior:'smooth'})};
$('bsave').onclick=async()=>{let id=+$('bid').value||0,title=$('btitle').value.trim();if(!title){show($('msg'),'Completá el título principal del banner.','err');return}try{let iu=id?(B.find(x=>+x.id===id)?.image_url||null):null,f=$('bi').files[0];if(f){let u=await api('upload',{filename:f.name,content_type:f.type,base64:await file64(f),folder:'banners'});iu=u.public_url}await api('save_banner',{banner:{id:id||null,eyebrow:$('be').value.trim(),title,description:$('bd').value.trim(),button_text:$('bbt').value.trim(),button_url:$('bbu').value.trim(),image_url:iu,theme:$('btheme').value,icon:$('bicon').value.trim(),sort_order:+$('border').value||1,active:$('bactive').checked}});show($('msg'),'Banner guardado. Ya se verá en el catálogo.');resetB();await load()}catch(e){show($('msg'),e.message,'err')}};
window.delB=async id=>{let b=B.find(x=>+x.id===+id);if(!confirm('¿Eliminar el banner "'+b.title+'"?'))return;try{await api('delete_banner',{id});show($('msg'),'Banner eliminado.');await load()}catch(e){show($('msg'),e.message,'err')}};
boot();
</script>
</body></html>
